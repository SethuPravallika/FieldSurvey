<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herpetofauna VES Map – Rayagada & Kalahandi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#1d2a22;--muted:#5d6b62;--line:#cfd8cc;--acc:#2f6b4f;--red:#d62828}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--ink);color:#eef3ea}
header h1{font-size:15px;margin:0 auto 0 0}
button,.btn{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:4px;cursor:pointer}
.alt{background:transparent;border-color:#8aa596;color:#eef3ea}
.dk{background:transparent;color:var(--ink);border-color:var(--line)}
.danger{background:transparent;color:var(--red);border-color:var(--red)}
#main{flex:1;display:flex;min-height:0;position:relative}
#map{flex:1}
#panel{width:min(680px,62%);overflow-y:auto;background:#fbfcf8;border-left:1px solid var(--line);padding:12px;display:none}
#panel.open{display:block}
@media(max-width:800px){#panel{position:absolute;inset:0;width:100%;z-index:1000}}
h2{font-size:15px;margin:0}
.bar{display:flex;gap:6px;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
fieldset{border:1px solid var(--line);border-radius:4px;margin:0 0 10px;padding:8px}
legend{font-size:12px;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
label{display:block;font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;font-size:13px;padding:5px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
.full{grid-column:1/-1}
.obs{border:1px dashed var(--line);border-radius:4px;padding:6px;margin-bottom:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.thumbs div{position:relative}
.thumbs img{width:72px;height:54px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.thumbs b{position:absolute;top:0;right:0;background:#000a;color:#fff;font-size:12px;padding:0 5px;cursor:pointer}
.sheet{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:8px}
.sheet th,.sheet td{border:1px solid #888;padding:3px 5px;text-align:left;vertical-align:top}
.sheet th{background:#eef2e9;font-weight:600}
.sheet td img{width:80px;height:60px;object-fit:cover;margin:2px}
.wrap{overflow-x:auto}
.msg{font-size:12px;margin:6px 0}
.err{color:var(--red);font-size:12px}
#auth{position:fixed;inset:0;z-index:5000;background:linear-gradient(160deg,#16301f,#2f6b4f);display:flex;align-items:center;justify-content:center;padding:16px}
#auth form{background:#fff;border-radius:8px;padding:22px;width:min(380px,100%);box-shadow:0 10px 30px #0006}
#auth h1{font-size:18px;margin:0 0 2px}#auth p{margin:0 0 14px;font-size:13px;color:var(--muted)}
#auth label{margin-bottom:10px}#auth button{width:100%;margin-top:4px}
#auth .tabs{display:flex;gap:0;margin:10px 0 12px;border-bottom:2px solid var(--line)}
#auth .tabs button{width:auto;flex:1;margin:0;background:none;border:none;border-bottom:3px solid transparent;border-radius:0;color:var(--muted);font-weight:600;padding:8px}
#auth .tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
#auth .ok{color:var(--acc);font-size:12px}
#auth .sw{background:none;border:none;color:var(--acc);text-decoration:underline;margin-top:8px;font-size:12px}
.fn{font-size:10.5px}
.sheet .tt{text-align:center;font-size:14px}
#modal{position:fixed;inset:0;background:#0007;z-index:3000;display:none;align-items:center;justify-content:center}
#modal>div{background:#fff;border-radius:6px;padding:14px;width:min(760px,96%);max-height:88%;overflow:auto}
#modal table{width:100%;border-collapse:collapse;font-size:13px}
#modal td,#modal th{border-bottom:1px solid var(--line);padding:3px;text-align:left}
#modal input{padding:3px}
.pop{font-size:12px;line-height:1.4}
</style></head>

[[gTotal,'Grids – total (168)'],[gSel,'Grids – selected (45)'],[gCore,'Core area']].forEach(([g,n])=>{g.addTo(map);ctl.addOverlay(g,n)});
const LCBase='https://ic.imagery1.arcgis.com/arcgis/rest/services/Sentinel2_10m_LandCover/ImageServer/exportImage';
const LCLayer=L.TileLayer.extend({getTileUrl(c){
  const t=this.getTileSize(),nw=c.multiplyBy(t.x),se=nw.add(t),crs=map.options.crs;
  const p=crs.project(map.unproject(nw,c.z)),q=crs.project(map.unproject(se,c.z));
  return LCBase+'?bbox='+[p.x,q.y,q.x,p.y].join(',')+'&bboxSR=3857&imageSR=3857&size=256,256&format=png&transparent=true&f=image';}});
ctl.addOverlay(new LCLayer('',{opacity:.7,maxZoom:17,attribution:'Land cover: Impact Observatory, Microsoft, Esri'}),'Land / forest cover (Esri 10 m)');
const layer=L.featureGroup().addTo(map);

const SHAPES={circle:'<circle cx="12" cy="12" r="9"/>',square:'<rect x="4" y="4" width="16" height="16"/>',triangle:'<polygon points="12,3 22,21 2,21"/>',diamond:'<polygon points="12,2 22,12 12,22 2,12"/>',star:'<polygon points="12,2 15,9 22,9.5 16.5,14 18.5,21.5 12,17.5 5.5,21.5 7.5,14 2,9.5 9,9"/>',hexagon:'<polygon points="12,2 21,7 21,17 12,22 3,17 3,7"/>',pentagon:'<polygon points="12,2 22,9.5 18,21 6,21 2,9.5"/>',cross:'<polygon points="9,2 15,2 15,9 22,9 22,15 15,15 15,22 9,22 9,15 2,15 2,9 9,9"/>'};
const SHAPE_KEYS=Object.keys(SHAPES),COLORS=['#d62828','#1d4ed8','#7e22ce','#ea7c0a','#0f9d8a','#db2777','#7a4a1e','#111827'];
function symFor(cid){
  if(!cid||cid==='manual')return {shape:'circle',color:'#555555'};
  let i=files.findIndex(f=>f.id===cid);if(i<0)i=0;
  return {shape:SHAPE_KEYS[i%8],color:COLORS[(i+Math.floor(i/8))%8]};
}
const svgSym=(s,w)=>`<svg width="${w}" height="${Math.round(w*4/3)}" viewBox="0 0 24 32" style="filter:drop-shadow(0 1px 2px #0008)"><path d="M12 1C5.9 1 1 5.8 1 11.8 1 19.7 12 31 12 31s11-11.3 11-19.2C23 5.8 18.1 1 12 1z" fill="${s.color}" stroke="#fff" stroke-width="1.5"/><g transform="translate(12 11.8) scale(.42) translate(-12 -12)" fill="#fff" stroke="none">${SHAPES[s.shape]}</g></svg>`;
function drawAll(fit){
  layer.clearLayers();markers={};
  Object.values(points).filter(p=>!p.hidden).forEach(p=>{
    const icon=L.divIcon({className:'',html:svgSym(symFor(p.csv_id),28),iconSize:[28,37],iconAnchor:[14,37],popupAnchor:[0,-34]});
    const m=L.marker([p.lat,p.lon],{icon});
    m.bindPopup(()=>`<div class="pop"><b>${esc(p.name||'Point')}</b><br>${f5(p.lat)}, ${f5(p.lon)}<br>Elevation: ${esc(p.elev||'–')} m<br>Grid ${esc(p.grid||'–')} · ${esc(p.division||'–')}</div>`);
    m.on('click',()=>show(p.id));m.addTo(layer);markers[p.id]=m;
  });
  if(fit&&layer.getLayers().length)map.fitBounds(layer.getBounds().pad(.1));
}

/* ---------- database ---------- */
async function load(fit){
  if(!authed)return;
  const [a,b]=await Promise.all([sb.from('csv_files').select('*').order('created_at'),sb.from('points').select('id,csv_id,data')]);
  if(a.error||b.error){alert('Could not load data: '+(a.error||b.error).message);return}
  files=a.data;points={};
  b.data.forEach(r=>points[r.id]={...r.data,id:r.id,csv_id:r.csv_id});
  drawAll(fit);
  if(current&&mode==='view'){if(points[current]&&!points[current].hidden)show(current);else closePanel()}
}
const dbRow=p=>{const {id,csv_id,...d}=p;return {id,csv_id:csv_id||null,data:d,updated_at:new Date().toISOString()}};
async function getPhotos(pid){
  if(phCache[pid])return phCache[pid];
  const {data}=await sb.from('photos').select('obs_id,data').eq('point_id',pid);
  const m={};(data||[]).forEach(r=>(m[r.obs_id]=m[r.obs_id]||[]).push(r.data));
  return phCache[pid]=m;
}

/* ---------- CSV loading (multiple) ---------- */
$('csv').onchange=async e=>{
  let n=0;
  for(const f of e.target.files){
    const res=await new Promise(r=>Papa.parse(f,{header:true,skipEmptyLines:true,complete:r}));
    const cid='c'+uid(),rows=[];
    res.data.forEach(row=>{
      const g=names=>{for(const k in row){if(names.includes(k.toLowerCase().replace(/[^a-z]/g,'')))return row[k]}return ''};
      const lat=r5(g(['latitude','lat','latituden','y'])),lon=r5(g(['longitude','lon','long','lng','longitudee','x']));
      if(isNaN(lat)||isNaN(lon))return;
      rows.push(dbRow({id:'p'+uid(),csv_id:cid,name:g(['name','label','pointid'])||'',lat,lon,elev:g(['elevation','elev','altitude','elevationm','height']),obs:[]}));
    });
    if(!rows.length){alert(f.name+': no valid latitude/longitude rows found.');continue}
    await sb.from('csv_files').insert({id:cid,name:f.name});
    const {error}=await sb.from('points').insert(rows);
    if(error)alert(error.message);else n+=rows.length;
  }
  e.target.value='';await load(true);alert(n+' point(s) added.');
};

/* ---------- CSV manager ---------- */
const modal=$('modal');
modal.onclick=e=>{if(e.target===modal)modal.style.display='none'};
const grp=cid=>Object.values(points).filter(p=>(p.csv_id||'manual')===cid);
$('bcsv').onclick=()=>{
  const list=[...files,{id:'manual',name:'Manually added points'}];
  $('mbox').innerHTML=`<div class="bar"><h2>My CSV files</h2><button class="dk" onclick="modal.style.display='none'">Close</button></div>
  <table>${list.map(f=>`<tr><td>${esc(f.name)}</td><td>${grp(f.id).length} points (${grp(f.id).filter(p=>!p.hidden).length} on map)</td><td style="text-align:right"><button onclick="editCsv('${f.id}')">View / edit</button> <button class="danger" onclick="rmCsv('${f.id}')">Remove</button></td></tr>`).join('')}</table>`;
  modal.style.display='flex';
};
async function rmCsv(cid){
  if(!confirm('Remove this file AND all its points with their saved datasheets/photos?'))return;
  const ids=grp(cid).map(p=>p.id);
  if(ids.length){await sb.from('photos').delete().in('point_id',ids);await sb.from('points').delete().in('id',ids)}
  if(cid!=='manual')await sb.from('csv_files').delete().eq('id',cid);
  closePanel();await load();$('bcsv').click();
}
let delIds=[];
function editCsv(cid){
  delIds=[];const f=files.find(x=>x.id===cid);
  const tr=p=>`<tr data-pid="${p?p.id:''}"><td><input class="n" value="${esc(p?.name)}"></td><td><input class="la" type="number" step="0.00001" value="${p?f5(p.lat):''}"></td><td><input class="lo" type="number" step="0.00001" value="${p?f5(p.lon):''}"></td><td><input class="el" type="number" step="any" value="${esc(p?.elev)}"></td><td style="text-align:center"><input class="vis" type="checkbox"${p&&p.hidden?'':' checked'}></td><td><button class="danger" onclick="rmRow(this)">×</button></td></tr>`;
  window._tr=tr;
  $('mbox').innerHTML=`<div class="bar"><h2>${esc(f?f.name:'Manually added points')}</h2><button class="dk" onclick="$('bcsv').click()">Back</button></div>
  <table><thead><tr><th>Name</th><th>Latitude</th><th>Longitude</th><th>Elevation (m)</th><th>On map</th><th></th></tr></thead><tbody id="tb">${grp(cid).map(tr).join('')}</tbody></table>
  <div class="row" style="margin-top:8px"><button class="dk" onclick="$('tb').insertAdjacentHTML('beforeend',_tr())">+ Add row</button><button onclick="saveCsv('${cid}')">Save changes</button></div><div class="msg" id="cm"></div>`;
}
function rmRow(b){const r=b.closest('tr');if(r.dataset.pid)delIds.push(r.dataset.pid);r.remove()}
async function saveCsv(cid){
  const up=[];
  [...$('tb').rows].forEach(r=>{
    const lat=r5(r.querySelector('.la').value),lon=r5(r.querySelector('.lo').value);if(isNaN(lat)||isNaN(lon))return;
    const old=points[r.dataset.pid]||{id:'p'+uid(),obs:[]};
    up.push(dbRow({...old,csv_id:cid==='manual'?null:cid,name:r.querySelector('.n').value,lat,lon,elev:r.querySelector('.el').value,hidden:!r.querySelector('.vis').checked}));
  });
  if(delIds.length){await sb.from('photos').delete().in('point_id',delIds);await sb.from('points').delete().in('id',delIds)}
  if(up.length){const {error}=await sb.from('points').upsert(up);if(error)return $('cm').textContent=error.message}
  await load();editCsv(cid);$('cm').textContent='Saved.';
}

/* ---------- datasheet view / download ---------- */
function sheet(p,ph,photos={}){
  const c=(l,v,s)=>`<th>${l}</th><td${s?` colspan="${s}"`:''}>${esc(v)}</td>`;
  const full=(arr,c)=>c?(arr.find(a=>a[0]===c)||[0,c])[1]:'';const ageF=c=>c==='A'?'Adult':c==='J'?'Juvenile':(c||'');
  const obs=[...(p.obs||[])];if(!ph)while(obs.length<10)obs.push({});
  return `<div class="wrap"><table class="sheet"><tr><th colspan="6" class="tt">VES Datasheet (Herpetofauna Baseline)${p.name?' – '+esc(p.name):''}</th></tr>
  <tr>${c('Date',p.date)}${c('Temperature (°C)',p.temp)}${c('Relative Humidity (%)',p.humidity)}</tr>
  <tr>${c('Start Time',p.start)}${c('End Time',p.end)}${c('Duration',p.duration)}</tr>
  <tr>${c('Division',p.division)}${c('Range',p.range)}${c('Beat',p.beat)}</tr>
  <tr>${c('Site (Grid) ID',p.grid)}${c('Latitude (N)',f5(p.lat))}${c('Longitude (E)',f5(p.lon))}</tr>
  <tr>${c('Elevation (m)',p.elev)}<th>Habitat Type</th><td colspan="3">${esc(p.habitat)}</td></tr>
  <tr>${c('Remarks',p.remarks,5)}</tr></table>
  <table class="sheet sp"><tr><th style="width:5%">S. No.</th><th style="width:22%">Species</th><th style="width:7%">No. (indv.)</th><th style="width:9%">Latitude</th><th style="width:9%">Longitude</th><th style="width:8%">Age (A,J)*</th><th style="width:11%">Sex</th><th style="width:20%">Microhabitat**</th><th style="width:9%">Activity***</th></tr>
  ${obs.map((o,i)=>`<tr><td>${o.species||o.count?i+1:(ph?'':'&nbsp;')}</td><td>${esc(o.species)}</td><td>${esc(o.count)}</td><td>${f5(o.lat)}</td><td>${f5(o.lon)}</td><td>${esc(ageF(o.age))}</td><td>${esc(o.sex)}</td><td>${esc(full(MICRO,o.micro))}</td><td>${esc(full(ACT,o.activity))}</td></tr>${ph&&(photos[o.id]||[]).length?`<tr><td colspan="9">${photos[o.id].map(s=>`<a href="${s}" target="_blank"><img src="${s}"></a>`).join('')}</td></tr>`:''}`).join('')}</table>
  <div class="fn">*Age: A-Adult, J-Juvenile<br>Microhabitat**: ${MICRO.map(m=>m[1].toLowerCase()+' ('+m[0]+')').join(', ')}<br>Activity***: ${ACT.map(m=>m[1]+' ('+m[0]+')').join(', ')}.</div></div>`;
}
function docFile(list,name){
  const css='@page{size:29.7cm 21cm;mso-page-orientation:landscape;margin:1cm}body{font-family:Calibri,Arial;font-size:11pt}table{border-collapse:collapse;width:100%;margin:0 0 4pt}th,td{border:1px solid #000;padding:2pt 4pt;text-align:left;vertical-align:middle;font-size:11pt;height:22pt}th{background:#eee}.sp th,.sp td{height:25pt}.tt{text-align:center;font-size:12pt}.fn{font-size:10pt;line-height:1.15;margin:0}';
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>${css}</style></head><body>${list.map((p,i)=>`<div${i<list.length-1?' style="page-break-after:always"':''}>${sheet(p,false)}</div>`).join('')}</body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',html],{type:'application/msword'}));a.download=name+'.doc';a.click();
}
$('ball').onclick=()=>{const l=Object.values(points).filter(p=>!p.hidden);if(!l.length)return alert('No points plotted yet.');docFile(l,'VES_Datasheet_All_Points')};

/* ---------- panel: view mode ---------- */
const panel=$('panel');
function closePanel(){panel.classList.remove('open');current=null;map.invalidateSize()}
async function show(id){
  current=id;mode='view';const p=points[id];if(!p)return;
  panel.classList.add('open');map.invalidateSize();map.panTo([p.lat,p.lon]);
  panel.innerHTML=`<div class="bar"><h2>${esc(p.name||'Sampling point')}</h2><div class="row"><button onclick="edit()">Edit</button><button class="dk" onclick="docFile([points['${id}']],'VES_Datasheet_'+(points['${id}'].name||'point').replace(/\\W+/g,'_'))">Download (.doc)</button><button class="danger" onclick="delSheet('${id}')">Delete datasheet</button><button class="dk" onclick="closePanel()">Close</button></div></div><div id="sh">Loading…</div>`;
  const ph=await getPhotos(id);
  if(current===id&&mode==='view')$('sh').innerHTML=sheet(p,true,ph);
}

async function delSheet(id){
  if(!confirm('Delete this datasheet and remove the point from the map?\n\nThe point stays in its CSV file (My CSV files), where you can show it on the map again.'))return;
  const p=points[id],keep={id:p.id,csv_id:p.csv_id,name:p.name,lat:p.lat,lon:p.lon,elev:p.elev,obs:[],hidden:true};
  const {error}=await sb.from('points').upsert(dbRow(keep));if(error)return alert(error.message);
  await sb.from('photos').delete().eq('point_id',id);
  points[id]=keep;phCache[id]=null;closePanel();drawAll();
}
/* ---------- panel: edit mode ---------- */
const opt=(arr,sel)=>'<option value="">Select…</option>'+arr.map(a=>{const v=Array.isArray(a)?a[0]:a,t=Array.isArray(a)?`${a[1]} (${a[0]})`:a;return `<option value="${esc(v)}"${String(sel)===String(v)?' selected':''}>${esc(t)}</option>`}).join('');
const timeSel=(id,v='')=>{const[h,m]=v.split(':');const o=(n,s)=>'<option value="">--</option>'+Array.from({length:n},(_,i)=>{const t=String(i).padStart(2,'0');return `<option${t===s?' selected':''}>${t}</option>`}).join('');return `<span class="row" style="flex-wrap:nowrap"><select id="${id}_h" onchange="calcDur()">${o(24,h)}</select>:<select id="${id}_m" onchange="calcDur()">${o(60,m)}</select></span>`};
const getT=id=>$(id+'_h').value&&$(id+'_m').value?$(id+'_h').value+':'+$(id+'_m').value:'';
function obsHTML(o){
  return `<div class="obs" data-oid="${o.id}"><div class="bar" style="margin:0 0 4px"><b style="font-size:12px">Species</b><button class="danger" onclick="rmObs(this)">Remove</button></div><div class="g">
  <label class="full">Species<input data-o="species" value="${esc(o.species)}"></label>
  <label>No. (indv.)<input data-o="count" type="number" min="0" value="${esc(o.count)}"></label>
  <label>Age<select data-o="age">${opt([['A','Adult'],['J','Juvenile']],o.age)}</select></label>
  <label>Latitude<input data-o="lat" type="number" step="0.00001" value="${o.lat?f5(o.lat):''}"></label>
  <label>Longitude<input data-o="lon" type="number" step="0.00001" value="${o.lon?f5(o.lon):''}"></label>
  <label>Sex<select data-o="sex">${opt(['Female','Male','Unidentified'],(o.sex==='Any'?'Unidentified':o.sex))}</select></label>
  <label>Activity<select data-o="activity">${opt(ACT,o.activity)}</select></label>
  <label class="full">Microhabitat<select data-o="micro">${opt(MICRO,o.micro)}</select></label>
  <div class="full"><label>Photos of this species (max 5)<input type="file" accept="image/*" multiple onchange="addPh(this,'${o.id}')"></label><div class="thumbs" id="th_${o.id}"></div></div></div></div>`;
}
async function edit(){
  const p=points[current];mode='edit';
  const ph=await getPhotos(current);editPh={};for(const k in ph)editPh[k]=[...ph[k]];
  panel.innerHTML=`<div class="bar"><h2>Editing: ${esc(p.name||'point')}</h2><div class="row"><button onclick="saveP()">Save</button><button class="dk" onclick="show('${p.id}')">Cancel</button></div></div>
  <fieldset><legend>Sampling point (GPS)</legend><div class="g">
   <label class="full">Point name<input id="f_name" value="${esc(p.name)}"></label>
   <label>Latitude (N)<input id="f_lat" type="number" step="0.00001" value="${f5(p.lat)}"></label>
   <label>Longitude (E)<input id="f_lon" type="number" step="0.00001" value="${f5(p.lon)}"></label>
   <label>Elevation (m)<input id="f_elev" type="number" step="any" value="${esc(p.elev)}"></label></div></fieldset>
  <fieldset><legend>Survey details</legend><div class="g">
   <label>Date<input id="f_date" type="date" value="${esc(p.date)}"></label>
   <label>Site (Grid) ID<select id="f_grid">${opt(Array.from({length:168},(_,i)=>i+1),p.grid)}</select></label>
   <label>Division<input id="f_division" value="${esc(p.division)}"></label>
   <label>Range<input id="f_range" value="${esc(p.range)}"></label>
   <label>Beat<input id="f_beat" value="${esc(p.beat)}"></label>
   <label>Duration (auto)<input id="f_duration" readonly placeholder="Filled from start/end time" value="${esc(p.duration)}"></label>
   <label>Start time (24 h)${timeSel('f_start',p.start)}</label>
   <label>End time (24 h)${timeSel('f_end',p.end)}</label>
   <label>Temperature (°C)<input id="f_temp" type="number" step="any" value="${esc(p.temp)}"></label>
   <label>Relative humidity (%)<input id="f_humidity" type="number" step="any" value="${esc(p.humidity)}"></label>
   <label class="full">Habitat type<select id="f_habitat">${opt(HAB,p.habitat)}</select></label>
   <label class="full">Remarks<textarea id="f_remarks" rows="2">${esc(p.remarks)}</textarea></label></div></fieldset>
  <fieldset><legend>Species observations</legend><div id="obslist">${(p.obs||[]).map(obsHTML).join('')}</div><button class="dk" onclick="addObs()">+ Add species row (max 10)</button></fieldset>
  <div class="msg" id="msg"></div>`;
  (p.obs||[]).forEach(o=>thumbs(o.id));
}
function calcDur(){
  const s=getT('f_start'),e=getT('f_end'),d=$('f_duration');if(!d)return;
  if(!s||!e){d.value='';return}
  let m=(+e.slice(0,2)*60+ +e.slice(3))-(+s.slice(0,2)*60+ +s.slice(3));if(m<0)m+=1440;
  d.value=Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
}
function addObs(){
  if(document.querySelectorAll('#obslist .obs').length>=10){alert('Maximum 10 species rows per datasheet.');return}const o={id:'o'+uid()};$('obslist').insertAdjacentHTML('beforeend',obsHTML(o));thumbs(o.id)}
function rmObs(b){const d=b.closest('.obs');delete editPh[d.dataset.oid];d.remove()}
function thumbs(oid){
  const a=editPh[oid]||[];
  $('th_'+oid).innerHTML=a.map((s,i)=>`<div><img src="${s}"><b onclick="editPh['${oid}'].splice(${i},1);thumbs('${oid}')">×</b></div>`).join('');
}
function addPh(inp,oid){
  editPh[oid]=editPh[oid]||[];
  [...inp.files].forEach(f=>{
    if(editPh[oid].length>=5){alert('Maximum 5 photos per species.');return}
    const img=new Image(),u=URL.createObjectURL(f);
    img.onload=()=>{
      if(editPh[oid].length>=5){URL.revokeObjectURL(u);return}
      const r=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      editPh[oid].push(c.toDataURL('image/jpeg',.65));URL.revokeObjectURL(u);thumbs(oid);
    };img.src=u;
  });inp.value='';
}
async function saveP(){
  const p=points[current],v=id=>$(id).value,m=$('msg');
  const lat=r5(v('f_lat')),lon=r5(v('f_lon'));
  if(isNaN(lat)||isNaN(lon)){m.textContent='Enter valid latitude and longitude.';return}
  p.name=v('f_name');p.lat=lat;p.lon=lon;p.elev=v('f_elev');
  TXT.forEach(k=>{if(k!=='start'&&k!=='end')p[k]=v('f_'+k)});
  p.start=getT('f_start');p.end=getT('f_end');
  p.obs=[...document.querySelectorAll('#obslist .obs')].map(d=>{
    const o={id:d.dataset.oid};d.querySelectorAll('[data-o]').forEach(i=>o[i.dataset.o]=i.value);
    ['lat','lon'].forEach(k=>{if(o[k]!=='')o[k]=r5(o[k])});return o;
  });
  m.textContent='Saving…';
  let r=await sb.from('points').upsert(dbRow(p));if(r.error){m.textContent='Error: '+r.error.message;return}
  await sb.from('photos').delete().eq('point_id',p.id);
  const rows=[];p.obs.forEach(o=>(editPh[o.id]||[]).forEach((d,i)=>rows.push({id:o.id+'_'+i+'_'+uid(),point_id:p.id,obs_id:o.id,data:d})));
  if(rows.length){r=await sb.from('photos').insert(rows);if(r.error){m.textContent='Photos not saved: '+r.error.message;return}}
  phCache[p.id]=null;drawAll();show(p.id);
}

/* ---------- add point by typing coordinates ---------- */
$('badd').onclick=()=>{
  current=null;mode='add';panel.classList.add('open');map.invalidateSize();
  panel.innerHTML=`<div class="bar"><h2>Add point</h2><button class="dk" onclick="closePanel()">Close</button></div>
  <fieldset><div class="g"><label class="full">Point name (optional)<input id="a_n"></label>
  <label>Latitude (N)<input id="a_la" type="number" step="0.00001" placeholder="19.17120"></label>
  <label>Longitude (E)<input id="a_lo" type="number" step="0.00001" placeholder="83.41650"></label>
  <label>Elevation (m)<input id="a_el" type="number" step="any"></label></div></fieldset>
  <button onclick="addPt()">Add to map</button><div class="msg" id="msg"></div>`;
};
async function addPt(){
  const lat=r5($('a_la').value),lon=r5($('a_lo').value);
  if(isNaN(lat)||isNaN(lon)){$('msg').textContent='Enter valid latitude and longitude (up to 5 decimals).';return}
  const p={id:'p'+uid(),csv_id:null,name:$('a_n').value,lat,lon,elev:$('a_el').value,obs:[]};
  const {error}=await sb.from('points').insert(dbRow(p));if(error){$('msg').textContent=error.message;return}
  points[p.id]=p;drawAll();map.setView([lat,lon],14);show(p.id);edit();
}

/* ---------- refresh ---------- */
$('bref').onclick=()=>{Object.keys(phCache).forEach(k=>phCache[k]=null);load()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mode!=='edit'&&mode!=='add')load()});
/* ---------- authentication: one shared user name + password ---------- */
const LOGIN_DOMAIN='herpetofauna.app';   // hidden suffix: user name "survey" is stored in Supabase as survey@herpetofauna.app
const toEmail=u=>{u=u.trim().toLowerCase();return u.includes('@')?u:u+'@'+LOGIN_DOMAIN};
const shortName=em=>em.endsWith('@'+LOGIN_DOMAIN)?em.slice(0,-LOGIN_DOMAIN.length-1):em;
function setAuthed(sess){
  authed=!!sess;
  $('auth').style.display=authed?'none':'flex';
  $('who').style.display=$('bout').style.display=authed?'':'none';
  $('who').textContent=authed?shortName(sess.user.email):'';
  if(authed)setTimeout(()=>load(true),0);
  else{points={};files=[];phCache={};try{drawAll()}catch(e){}closePanel();$('au_p').value=''}
}
sb.auth.onAuthStateChange((ev,sess)=>{
  if(ev==='SIGNED_OUT')setAuthed(null);
  else if(sess&&!authed&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'))setAuthed(sess);
});
$('authform').onsubmit=async e=>{
  e.preventDefault();const m=$('automsg');m.textContent='Logging in…';
  const {error}=await sb.auth.signInWithPassword({email:toEmail($('au_e').value),password:$('au_p').value});
  m.textContent=error?(/invalid login/i.test(error.message)?'Wrong user name or password.':error.message):'';
};
$('bout').onclick=()=>sb.auth.signOut();
</script>
</body></html>
